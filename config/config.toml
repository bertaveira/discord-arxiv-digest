# Re-read before every run, so cutoff edits apply without restarting the bot.
# Changes to the schedule (post_time, timezone, retry_hours) need a restart.

# arXiv categories to follow. arXiv merges them into one feed without duplicates.
categories = ["cs.CV", "cs.GR"]

# "new" = first announcement, "cross" = cross-listed from another category.
# ("replace" / "replace-cross" are updated versions of older papers.)
announce_types = ["new", "cross"]

# When to post, in `timezone`. arXiv refreshes the feed at midnight US Eastern
# (06:00 Stockholm time, 05:00 for a week or two when US and EU daylight saving
# dates differ) on Sunday-Thursday nights. The bot checks again every hour for
# `retry_hours` in case the feed is late; a paper is never posted twice.
post_time = "08:00"
timezone = "Europe/Stockholm"
retry_hours = 3

[similarity]
# Each paper is scored by how similar it is to its closest seed paper (SPECTER2
# cosine similarity; in practice scores fall between about 0.80 and 0.97).
# Papers at or above `relevant` are posted as the main list. Papers between
# `borderline` and `relevant` are posted under "Probably not relevant", so you
# can see what sits just below the line. Over three weeks of cs.CV + cs.GR,
# 0.93 averaged ~6 relevant papers a day (2 on the quietest day, 16 on the busiest).
relevant = 0.93
borderline = 0.91

[seeds]
